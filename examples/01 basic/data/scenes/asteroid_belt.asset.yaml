---
asset_type: render_pass
asset_data:
  textures: { }

  frame_buffers:
    back_buffer:
      config:
        DepthTest: Enabled

    scene_buffer:
      config:
        DepthTest: Enabled
        Blend: Enabled
        SrcBlendFactor: SrcAlpha
        DstBlendFactor: OneMinusSrcAlpha
        PointSize: 3
        CullFace: Enabled
      attachments:
        depth:
          type: RenderBufferDefinition
          format: Depth24
          channels: Depth
          samples: 4
        color:
          0:
            type: RenderBufferDefinition
            format: Unsigned8
            channels: RGB
            samples: 4

    resolve_buffer:
      attachments:
        color:
          0:
            type: Texture2DDefinition
            format: Unsigned8
            channels: RGBA

    scene_depth:
      attachments:
        depth:
          type: Texture2DDefinition
          format: Depth24
          channels: Depth

  cameras:
  - name: default_camera
    type: main
    np: 0.1
    fp: 500.0
    fov: 1.0

  gui_uniforms:
    - name: u_useSpecular
      type: bool
      default: false

    - name: u_tessLevel
      type: float
      range: [1, 64]
      step: 1
      default: 2

  draw_calls:
    - type: clear
      output_buffer: scene_buffer
      mask: Color|Depth
      color: [0.3, 0.3, 0.3, 1.0]

    - type: single_mesh
      output_buffer: scene_buffer
      gl_primitive: Triangles
      shader: shaders/planet
      mesh:
        source: models/space/meshes/3
        vertices: Position|Normal|TexCoords
      uniform_textures:
        - uniform: u_texture
          config:
            MinFilter: Linear
            MagFilter: Linear
          asset: textures/planets/mars
      uniform_cameras:
      - name: default_camera
        uniform: u_camera
        uniform_members: [VP, position, direction]
      gui_uniforms:
      - u_useSpecular
      model_uniform: u_M
      time_uniform: u_t
      transforms:
      - translate: [0, -3, 0]
      - scale: [3, 1, 3]

    - output_buffer: scene_buffer
      gl_primitive: Triangles
      shader: shaders/planet
      mesh:
        source: models/plane/meshes/0
        vertices: Position|Normal|TexCoords
      type: single_mesh
      uniform_textures:
      - uniform: u_texture
        config:
          MinFilter: Linear
          MagFilter: Linear
        asset: textures/planets/mars
      uniform_cameras:
      - name: default_camera
        uniform: u_camera
        uniform_members:
        - VP
        - position
        - direction
      gui_uniforms:
      - u_useSpecular
      model_uniform: u_M
      time_uniform: u_t
      transforms:
      - translate:
        - 0
        - -3
        - 0
      - scale:
        - 1.03
        - 1.03
        - 1.03

    - input_buffer: scene_buffer
      output_buffer: scene_depth
      mask: Depth
      filter: Nearest
      type: blit

    # Draw water
    - output_buffer: scene_buffer
      gl_primitive: Patches
      shader:
        asset: shaders/water
        config:
          PatchVertices: 3
      mesh:
        source: models/plane/meshes/0
        vertices: Position|Normal|TexCoords|Tangent|Bitangent
      type: single_mesh
      uniform_textures:
      - uniform: u_sceneDepth
        frame_buffer: scene_depth
        attachment:
          type: depth
      uniform_cameras:
      - name: default_camera
        uniform: u_camera
        uniform_members:
        - VP
        - position
        - direction
        - np
        - fp
      gui_uniforms:
      - u_tessLevel
      model_uniform: u_M
      time_uniform: u_t
      transforms:
      - translate: [0, 0, 0]
      - scale: [2, 2, 2]

    - input_buffer: scene_buffer
      output_buffer: resolve_buffer
      mask: Color
      type: blit

    - output_buffer: resolve_buffer
      shader: shaders/post_process/gradient_sky
      type: post_process
      uniform_textures:
      - uniform: u_depth
        frame_buffer: scene_depth
        attachment:
          type: depth
      - uniform: u_color
        frame_buffer: resolve_buffer
        attachment:
          type: color
          index: 0
      uniform_cameras:
      - name: default_camera
        uniform: u_camera
        uniform_members:
        - nearPlane
        - farPlane

#    - type: post_process
#      output_buffer: resolve_buffer
#      shader: shaders/post_process/display_depth
#      uniform_textures:
#        - uniform: u_depth
#          frame_buffer: scene_depth
#          attachment:
#            type: depth

    - input_buffer: resolve_buffer
      output_buffer: back_buffer
      type: blit
