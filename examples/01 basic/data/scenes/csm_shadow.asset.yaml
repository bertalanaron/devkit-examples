---
asset_type: render_pass
asset_data:
  cameras:
  - name: default_camera
    type: main
    np: 0.1
    fp: 500.0
    fov: 1.0
  - name: sun
    type: csm_sun
    np: 0.1
    fp: 100.0
    cascade_count: 3
    direction:
    - -0.5
    - -1.0
    - -0.25
    shadow_resolution: 2024
  gui_uniforms:
  - name: u_showCascades
    type: bool
    default: true
  - name: u_shadows
    type: bool
    default: true
  draw_calls:
  # The sun owns a depth texture array; the geometry shader writes every cascade.
  - output_buffer: sun_shadow
    mask: Depth
    type: clear
  - output_buffer: sun_shadow
    model_uniform: u_M
    shader: shaders/shadow_depth
    mesh:
      source: models/space/meshes/3
      vertices: Position
    gl_primitive: Triangles
    type: single_mesh
    uniform_cameras:
    - name: sun
      uniform: u_sun
      uniform_members:
      - lightspaceM
      - cascadeCount
    transforms:
    - translate:
      - 0
      - -3
      - 0
    - scale:
      - 3
      - 1
      - 3
  - output_buffer: sun_shadow
    model_uniform: u_M
    shader: shaders/shadow_depth
    mesh:
      source: models/space/meshes/2
      vertices: Position
    gl_primitive: Triangles
    type: single_mesh
    uniform_cameras:
    - name: sun
      uniform: u_sun
      uniform_members:
      - lightspaceM
      - cascadeCount
    transforms:
    - translate:
      - 0
      - 5
      - 0
    - scale:
      - 1
      - 1
      - 1
  - output_buffer: scene_buffer
    mask: Color|Depth
    color:
    - 0.2
    - 0.3
    - 0.6
    - 1.0
    type: clear
  - output_buffer: scene_buffer
    gl_primitive: Triangles
    shader: shaders/csm_lit
    mesh:
      source: models/space/meshes/3
      vertices: Position|Normal
    type: single_mesh
    uniform_textures:
    - uniform: u_shadowMap
      frame_buffer: sun_shadow
      attachment:
        type: depth
      config:
        MinFilter: Nearest
        MagFilter: Nearest
    uniform_cameras:
    - name: default_camera
      uniform: u_camera
      uniform_members:
      - VP
      - position
      - direction
      - np
      - fp
    - name: sun
      uniform: u_sun
      uniform_members:
      - lightspaceM
      - splitDepths
      - cascadeCount
      - direction
    model_uniform: u_M
    transforms:
    - translate:
      - 0
      - -3
      - 0
    - scale:
      - 3
      - 1
      - 3
    gui_uniforms:
    - u_showCascades
    - u_shadows
  - output_buffer: scene_buffer
    gl_primitive: Triangles
    shader: shaders/csm_lit
    mesh:
      source: models/space/meshes/2
      vertices: Position|Normal
    type: single_mesh
    uniform_textures:
    - uniform: u_shadowMap
      frame_buffer: sun_shadow
      attachment:
        type: depth
      config:
        MinFilter: Nearest
        MagFilter: Nearest
    uniform_cameras:
    - name: default_camera
      uniform: u_camera
      uniform_members:
      - VP
      - position
      - direction
      - np
      - fp
    - name: sun
      uniform: u_sun
      uniform_members:
      - lightspaceM
      - splitDepths
      - cascadeCount
      - direction
    model_uniform: u_M
    transforms:
    - translate:
      - 0
      - 5
      - 0
    - scale:
      - 1
      - 1
      - 1
    gui_uniforms:
    - u_showCascades
    - u_shadows
  - input_buffer: scene_buffer
    output_buffer: back_buffer
    type: blit
  textures: {}
  frame_buffers:
    back_buffer:
      config:
        DepthTest: Enabled
        PointSize: 1
    scene_buffer:
      config:
        DepthTest: Enabled
        CullFace: Enabled
        PointSize: 1
      attachments:
        color:
          0:
            type: RenderBufferDefinition
            format: Unsigned8
            channels: RGBA
        depth:
          type: RenderBufferDefinition
          format: Depth24
          channels: Depth
