asset_type: shader
asset_data:
  source_location: inplace
  vertex: |
    #version 330 core

    layout (location = 0) in vec3 a_pos;

    struct Camera {
        mat4 VP;
        vec3 position;
        vec3 direction;
    }; uniform Camera u_camera;

    out vec3 TexCoords;

    void main()
    {
        TexCoords = a_pos;
        vec4 pos = vec4(a_pos + u_camera.position, 1.0) * u_camera.VP;
        gl_Position = pos.xyww;
    }  

  fragment: |
    #version 330 core

    in vec3 TexCoords;
    out vec4 FragColor;
    
    uniform samplerCube u_skybox;
    
    void main()
    {
      FragColor = texture(u_skybox, TexCoords);
      // FragColor = vec4(TexCoords, 0);
    }
