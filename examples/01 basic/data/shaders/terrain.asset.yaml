asset_type: shader
asset_data:
  source_location: inplace

  vertex: |
    #version 400 core

    layout(location = 0) in vec3 vertex;

    void main()
    {
        gl_Position = vec4(vertex, 1.0);
    }

  tessellation_control: |
    #version 400 core

    layout(vertices = 3) out;

    struct Camera {
        mat4 VP;
        vec3 position;
    }; uniform Camera u_camera;

    uniform mat4 u_M;
    uniform sampler2D u_heightMap;
    uniform float u_terrainHeight;
    uniform float u_terrainTessLevel;
    uniform float u_tessNear;
    uniform float u_tessFar;

    float edgeLevel(vec3 a, vec3 b)
    {
        // Both adjacent patches use the same displaced edge midpoint.
        vec3 midpoint = (a + b) * 0.5;
        vec2 halfTexel = 0.5 / vec2(textureSize(u_heightMap, 0));
        vec2 uv = clamp(midpoint.xz + 0.5, halfTexel, 1.0 - halfTexel);
        midpoint.y = textureLod(u_heightMap, uv, 0.0).r * u_terrainHeight;
        vec3 world = (vec4(midpoint, 1.0) * u_M).xyz;
        float nearDistance = max(u_tessNear, 0.0);
        float farDistance = max(u_tessFar, nearDistance + 1.0);
        float fade = smoothstep(nearDistance, farDistance, distance(world, u_camera.position));
        return mix(clamp(u_terrainTessLevel, 2.0, 64.0), 2.0, fade);
    }

    void main()
    {
        gl_out[gl_InvocationID].gl_Position = gl_in[gl_InvocationID].gl_Position;
        if (gl_InvocationID == 0) {
            vec3 a = gl_in[0].gl_Position.xyz;
            vec3 b = gl_in[1].gl_Position.xyz;
            vec3 c = gl_in[2].gl_Position.xyz;
            float edge0 = edgeLevel(b, c);
            float edge1 = edgeLevel(c, a);
            float edge2 = edgeLevel(a, b);
            gl_TessLevelOuter[0] = edge0;
            gl_TessLevelOuter[1] = edge1;
            gl_TessLevelOuter[2] = edge2;
            gl_TessLevelInner[0] = max(edge0, max(edge1, edge2));
        }
    }

  tessellation_evaluation: |
    #version 400 core

    layout(triangles, fractional_even_spacing, ccw) in;

    struct Camera {
        mat4 VP;
        vec3 position;
    }; uniform Camera u_camera;

    uniform mat4 u_M;
    uniform sampler2D u_heightMap;
    uniform float u_terrainHeight;

    out vec3 Normal;
    out vec3 Position;

    float elevation(vec2 uv)
    {
        vec2 halfTexel = 0.5 / vec2(textureSize(u_heightMap, 0));
        return textureLod(u_heightMap, clamp(uv, halfTexel, 1.0 - halfTexel), 0.0).r
             * u_terrainHeight;
    }

    void main()
    {
        vec3 local = gl_in[0].gl_Position.xyz * gl_TessCoord.x
                   + gl_in[1].gl_Position.xyz * gl_TessCoord.y
                   + gl_in[2].gl_Position.xyz * gl_TessCoord.z;
        // The terrain grid spans [-0.5, 0.5] in X/Z, covering the whole map.
        vec2 uv = local.xz + 0.5;
        local.y = elevation(uv);

        vec2 texel = 1.0 / vec2(textureSize(u_heightMap, 0));
        float dx = elevation(uv + vec2(texel.x, 0.0)) - elevation(uv - vec2(texel.x, 0.0));
        float dz = elevation(uv + vec2(0.0, texel.y)) - elevation(uv - vec2(0.0, texel.y));
        // Transform tangents before taking the normal to account for model scale.
        vec3 tangentX = (vec4(2.0 * texel.x, dx, 0.0, 0.0) * u_M).xyz;
        vec3 tangentZ = (vec4(0.0, dz, 2.0 * texel.y, 0.0) * u_M).xyz;
        Normal = normalize(cross(tangentZ, tangentX));

        // Devkit uploads transposed matrices; positions multiply on the left.
        vec4 world = vec4(local, 1.0) * u_M;
        Position = world.xyz;
        gl_Position = world * u_camera.VP;
    }

  fragment: |
    #version 400 core

    in vec3 Normal;
    in vec3 Position;
    out vec4 FragColor;

    uniform float u_grassHeight;
    uniform float u_stoneNormalThreshold;
    uniform float u_materialNoiseAmount;
    uniform float u_materialNoiseScale;

    float hash(vec3 p)
    {
        p = fract(p * 0.1031);
        p += dot(p, p.yzx + 33.33);
        return fract((p.x + p.y) * p.z);
    }

    float noise(vec3 p)
    {
        vec3 cell = floor(p);
        vec3 f = fract(p);
        vec3 blend = f * f * (3.0 - 2.0 * f);
        return mix(
            mix(mix(hash(cell), hash(cell + vec3(1, 0, 0)), blend.x),
                mix(hash(cell + vec3(0, 1, 0)), hash(cell + vec3(1, 1, 0)), blend.x), blend.y),
            mix(mix(hash(cell + vec3(0, 0, 1)), hash(cell + vec3(1, 0, 1)), blend.x),
                mix(hash(cell + vec3(0, 1, 1)), hash(cell + vec3(1, 1, 1)), blend.x), blend.y),
            blend.z);
    }

    float filteredNoise(vec3 p)
    {
        // Fade detail smaller than a pixel to avoid shimmering at a distance.
        float detail = 1.0 - smoothstep(0.35, 1.0, length(fwidth(p)));
        return mix(0.5, noise(p), detail);
    }

    float terrainNoise(vec3 p)
    {
        float result = 0.0;
        float weight = 0.5;
        for (int octave = 0; octave < 4; ++octave) {
            result += weight * filteredNoise(p);
            p = p * 2.0 + vec3(17.3, 9.2, 5.7);
            weight *= 0.5;
        }
        return result / 0.9375;
    }

    void main()
    {
        vec3 normal = normalize(Normal);
        // World-space texture coordinates keep material detail stable on slopes.
        float patches = terrainNoise(Position * 0.45);
        float grain = filteredNoise(Position * 14.0);
        vec3 sand = mix(vec3(0.64, 0.51, 0.30), vec3(0.88, 0.77, 0.52), patches)
                  * mix(0.9, 1.1, grain);

        float blades = filteredNoise(Position * vec3(3.0, 7.0, 3.0));
        vec3 grass = mix(vec3(0.14, 0.27, 0.055), vec3(0.34, 0.47, 0.12), patches)
                   * mix(0.85, 1.15, blades);

        float rock = terrainNoise(Position * 0.7);
        vec3 stone = vec3(mix(0.30, 0.57, rock))
                   * mix(0.9, 1.1, filteredNoise(Position * 8.0));

        // Noise perturbs the sand/grass boundary in world-space height units.
        float boundaryNoise = 2.0 * terrainNoise(
            vec3(Position.x, 0.0, Position.z) * max(u_materialNoiseScale, 0.001)) - 1.0;
        float noisyHeight = Position.y + boundaryNoise * max(u_materialNoiseAmount, 0.0);
        float heightBlend = max(fwidth(noisyHeight), 0.25);
        float grassMask = smoothstep(u_grassHeight - heightBlend, u_grassHeight + heightBlend, noisyHeight);

        // Upward-facing surfaces are sand/grass; steep and downward faces are stone.
        float skyFacing = dot(normal, vec3(0.0, 1.0, 0.0));
        float threshold = clamp(u_stoneNormalThreshold, 0.0, 1.0);
        float slopeBlend = max(fwidth(skyFacing), 0.025);
        float stoneMask = 1.0 - smoothstep(threshold - slopeBlend, threshold + slopeBlend, skyFacing);
        vec3 color = mix(mix(sand, grass, grassMask), stone, stoneMask);

        vec3 light = normalize(vec3(-0.35, 0.8, 0.25));
        float diffuse = max(dot(normal, light), 0.0);
        FragColor = vec4(color * (0.3 + 0.7 * diffuse), 1.0);
    }
