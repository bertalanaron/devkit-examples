asset_type: shader
asset_data:
  source_location: inplace

  vertex: |
    #version 400 core

    layout(location = 0) in vec3 vertex;

    void main()
    {
        gl_Position = vec4(vertex, 1.0);
    }

  tessellation_control: |
    #version 400 core

    layout(vertices = 3) out;

    struct Camera {
        mat4 VP;
        vec3 position;
        vec3 direction;
        float np;
        float fp;
    }; uniform Camera u_camera;

    uniform mat4 u_M;
    uniform float u_tessLevel;
    uniform float u_tessNear;
    uniform float u_tessFar;

    float edgeLevel(vec3 a, vec3 b)
    {
        // Use only the shared endpoints, independent of triangle winding.
        // Neighbouring patches must request exactly the same edge subdivision.
        vec3 midpoint = (vec4((a + b) * 0.5, 1.0) * u_M).xyz;
        float distanceToCamera = length(midpoint - u_camera.position);
        float nearDistance = max(u_tessNear, 0.0);
        float farDistance = max(u_tessFar, nearDistance + 1.0);
        float fade = smoothstep(nearDistance, farDistance, distanceToCamera);
        return mix(clamp(u_tessLevel, 2.0, 64.0), 2.0, fade);
    }

    void main()
    {
        gl_out[gl_InvocationID].gl_Position = gl_in[gl_InvocationID].gl_Position;
        if (gl_InvocationID == 0) {
            vec3 a = gl_in[0].gl_Position.xyz;
            vec3 b = gl_in[1].gl_Position.xyz;
            vec3 c = gl_in[2].gl_Position.xyz;
            // Each outer level controls the edge opposite its vertex.
            float edge0 = edgeLevel(b, c);
            float edge1 = edgeLevel(c, a);
            float edge2 = edgeLevel(a, b);
            gl_TessLevelOuter[0] = edge0;
            gl_TessLevelOuter[1] = edge1;
            gl_TessLevelOuter[2] = edge2;
            gl_TessLevelInner[0] = max(edge0, max(edge1, edge2));
        }
    }

  tessellation_evaluation: |
    #version 400 core

    // Fractional spacing blends in new segments as the camera moves.
    layout(triangles, fractional_even_spacing, ccw) in;

    struct Camera {
        mat4 VP;
        vec3 position;
        vec3 direction;
        float np;
        float fp;
    }; uniform Camera u_camera;

    uniform mat4 u_M;
    uniform float u_t;
    uniform float u_waveHeight;
    uniform float u_waveSpeed;

    out WATER_SURFACE {
        vec3 Position;
        vec3 Normal;
        vec2 Coordinates;
        float Compression;
    } surface;

    // Gerstner model: GPU Gems, "Effective Water Simulation from Physical Models".
    // Direction, wavelength, steepness. The steepness sum stays below one,
    // including the maximum height multiplier, to prevent folding crests.
    const vec4 waves[4] = vec4[4](
        vec4( 1.00,  0.25, 12.0, 0.24),
        vec4( 0.80,  0.60,  6.4, 0.17),
        vec4(-0.35,  1.00,  3.3, 0.10),
        vec4( 0.60, -0.80,  1.7, 0.06)
    );

    void main()
    {
        vec3 localPosition =
              gl_in[0].gl_Position.xyz * gl_TessCoord.x
            + gl_in[1].gl_Position.xyz * gl_TessCoord.y
            + gl_in[2].gl_Position.xyz * gl_TessCoord.z;

        // Devkit uploads transposed matrices; positions multiply on the left.
        // Evaluate in world units so mesh scale does not change the sea state.
        vec3 base = (vec4(localPosition, 1.0) * u_M).xyz;
        vec3 position = base;
        vec3 dPdx = vec3(1.0, 0.0, 0.0);
        vec3 dPdz = vec3(0.0, 0.0, 1.0);
        float height = clamp(u_waveHeight, 0.0, 1.5);
        float time = u_t * u_waveSpeed;

        // Deep-water Gerstner dispersion: omega = sqrt(gravity * wave number).
        // Analytic partial derivatives provide normals and crest compression.
        for (int i = 0; i < 4; ++i) {
            vec2 direction = normalize(waves[i].xy);
            float k = 6.2831853 / waves[i].z;
            float steepness = waves[i].w * height;
            float amplitude = steepness / k;
            float phase = k * dot(direction, base.xz) - sqrt(9.81 * k) * time;
            float s = sin(phase);
            float c = cos(phase);
            position += amplitude * vec3(direction.x * c, s, direction.y * c);
            dPdx += steepness * vec3(
                -direction.x * direction.x * s,
                 direction.x * c,
                -direction.x * direction.y * s);
            dPdz += steepness * vec3(
                -direction.x * direction.y * s,
                 direction.y * c,
                -direction.y * direction.y * s);
        }

        surface.Position = position;
        surface.Normal = normalize(cross(dPdz, dPdx));
        surface.Coordinates = base.xz;
        // Horizontal Jacobian: small areas correspond to compressing crests.
        surface.Compression = 1.0 - (dPdx.x * dPdz.z - dPdx.z * dPdz.x);
        gl_Position = vec4(position, 1.0) * u_camera.VP;
    }

  fragment: |
    #version 400 core

    struct Camera {
        mat4 VP;
        vec3 position;
        vec3 direction;
        float np;
        float fp;
    }; uniform Camera u_camera;

    uniform sampler2D u_sceneDepth;
    uniform sampler2D u_sceneColor;
    uniform float u_t;
    uniform float u_waveHeight;
    uniform float u_waveSpeed;
    uniform float u_foamWidth;
    uniform float u_foamAmount;
    uniform float u_refractionStrength;
    uniform float u_waterAbsorption;
    uniform float u_windStrength;
    uniform float u_windPatchSize;
    uniform float u_windDriftSpeed;

    in WATER_SURFACE {
        vec3 Position;
        vec3 Normal;
        vec2 Coordinates;
        float Compression;
    } surface;

    out vec4 FragColor;

    vec2 hash22(vec2 p)
    {
        vec3 q = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
        q += dot(q, q.yzx + 33.33);
        return fract((q.xx + q.yz) * q.zy);
    }

    float noise(vec2 p)
    {
        vec2 cell = floor(p);
        vec2 f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash22(cell).x, hash22(cell + vec2(1, 0)).x, u.x),
                   mix(hash22(cell + vec2(0, 1)).x, hash22(cell + vec2(1, 1)).x, u.x), u.y);
    }

    float filteredNoise(vec2 p)
    {
        float detail = 1.0 - smoothstep(0.35, 1.0, length(fwidth(p)));
        return mix(0.5, noise(p), detail);
    }

    float windCoverage(vec2 coordinates)
    {
        // Advect broad patches in world space, independently of wave speed.
        vec2 drift = normalize(vec2(1.0, 0.35)) * u_t * max(u_windDriftSpeed, 0.0);
        vec2 p = (coordinates - drift) / max(u_windPatchSize, 1.0);
        vec2 warp = vec2(filteredNoise(p * 0.65 + vec2(17.3, 9.2)),
                         filteredNoise(p * 0.65 + vec2(5.7, 31.8))) - 0.5;
        float coverage = 0.65 * filteredNoise(p + warp * 1.3 + vec2(13.7, 29.1))
                       + 0.35 * filteredNoise(p * 2.03 + warp + vec2(41.2, 7.6));
        return smoothstep(0.2, 0.8, coverage);
    }

    // Crisp toon boundaries with a pixel-sized transition to suppress shimmer.
    float band(float threshold, float value)
    {
        float width = max(fwidth(value), 0.002);
        return smoothstep(threshold - width, threshold + width, value);
    }

    // Distance to the nearest irregular bubble. The complement produces
    // connected foam with round, uneven holes rather than solid white stripes.
    float bubbles(vec2 p)
    {
        vec2 cell = floor(p);
        vec2 f = fract(p);
        float distanceToBubble = 8.0;
        for (int y = -1; y <= 1; ++y) {
            for (int x = -1; x <= 1; ++x) {
                vec2 offset = vec2(x, y);
                vec2 random = hash22(cell + offset);
                vec2 delta = offset + 0.2 + 0.6 * random - f;
                distanceToBubble = min(distanceToBubble, length(delta) / (0.65 + 0.35 * random.x));
            }
        }
        return distanceToBubble;
    }

    vec3 reconstructPosition(vec2 uv, float depth, mat4 inverseVP)
    {
        vec4 world = vec4(uv * 2.0 - 1.0, depth * 2.0 - 1.0, 1.0) * inverseVP;
        return world.xyz / world.w;
    }

    void main()
    {
        vec3 view = normalize(u_camera.position - surface.Position);
        float time = u_t * u_waveSpeed;
        vec2 p = surface.Coordinates;
        float wind = windCoverage(p);
        float windStrength = clamp(u_windStrength, 0.0, 1.0);
        float roughness = mix(1.0, mix(0.3, 1.65, wind), windStrength);

        // Fine wind ripples supplement the geometric swell. Fade subpixel
        // frequencies out before thresholding the lighting, especially at sea level.
        float rippleFade = 1.0 - smoothstep(0.15, 0.65, length(fwidth(p)));
        vec2 ripples = vec2(1.0, 0.35) * cos(dot(p, vec2(3.1, 1.1)) - time * 2.8)
                     + vec2(-0.4, 0.9) * cos(dot(p, vec2(-2.3, 5.2)) - time * 3.6);
        vec3 normal = normalize(surface.Normal - vec3(ripples.x, 0.0, ripples.y)
                              * 0.055 * roughness * rippleFade * clamp(u_waveHeight, 0.0, 1.5));
        if (dot(normal, view) < 0.0)
            normal = -normal;

        vec2 screenUV = gl_FragCoord.xy / vec2(textureSize(u_sceneDepth, 0));
        float sceneDepth = texture(u_sceneDepth, screenUV).r;
        mat4 inverseVP = inverse(u_camera.VP);
        float thickness = 50.0;
        float opticalPath = 50.0;
        vec2 refractionUV = screenUV;
        bool hasBackground = sceneDepth < 0.999999 && sceneDepth > gl_FragCoord.z;
        if (sceneDepth < 0.999999) {
            // Reconstruct the opaque point under this fragment. Vertical depth
            // keeps shoreline width consistent when the viewing angle changes.
            vec3 opaquePosition = reconstructPosition(screenUV, sceneDepth, inverseVP);
            thickness = max(surface.Position.y - opaquePosition.y, 0.0);
            opticalPath = length(opaquePosition - surface.Position);
        }

        if (hasBackground) {
            // Approximate the refracted ray's intersection with the seabed's
            // horizontal plane, then project it into the saved opaque scene.
            vec3 ray = refract(-view, normal, 1.0 / 1.333);
            float travel = min(thickness / max(-ray.y, 0.1), 50.0);
            vec4 target = vec4(surface.Position + ray * travel, 1.0) * u_camera.VP;
            if (target.w > 0.001) {
                vec2 offset = (target.xy / target.w * 0.5 + 0.5 - screenUV)
                            * clamp(u_refractionStrength, 0.0, 2.0);
                // Fade bending at contact points and screen borders.
                vec2 edge = min(screenUV, 1.0 - screenUV);
                offset *= smoothstep(0.0, 0.04, min(edge.x, edge.y))
                        * smoothstep(0.05, 0.75, thickness);
                vec2 halfTexel = 0.5 / vec2(textureSize(u_sceneDepth, 0));
                for (int attempt = 0; attempt < 4; ++attempt) {
                    vec2 uv = screenUV + offset;
                    if (all(greaterThanEqual(uv, halfTexel)) &&
                        all(lessThanEqual(uv, 1.0 - halfTexel))) {
                        // Color uses bilinear filtering: reject foreground in
                        // any of its four contributing depth texels as well.
                        vec4 depths = textureGather(u_sceneDepth, uv);
                        float closest = min(min(depths.x, depths.y), min(depths.z, depths.w));
                        float farthest = max(max(depths.x, depths.y), max(depths.z, depths.w));
                        if (closest > gl_FragCoord.z && farthest < 0.999999) {
                            float depth = texture(u_sceneDepth, uv).r;
                            vec3 opaquePosition = reconstructPosition(uv, depth, inverseVP);
                            if (opaquePosition.y < surface.Position.y) {
                                refractionUV = uv;
                                opticalPath = length(opaquePosition - surface.Position);
                                break;
                            }
                        }
                    }
                    // Shorten invalid offsets instead of pulling land or sky
                    // into the water; the undistorted sample is the fallback.
                    offset *= 0.5;
                }
            }
        }

        vec3 light = normalize(vec3(-0.35, 0.8, 0.25));
        float facing = clamp(dot(normal, view), 0.0, 1.0);
        float diffuse = dot(normal, light);
        float depthTint = 1.0 - exp(-thickness * 0.22);
        vec3 shallow = vec3(0.045, 0.67, 0.64);
        vec3 deep = vec3(0.018, 0.19, 0.39);
        vec3 water = mix(shallow, deep, depthTint);
        // Broad blue/green tint variation remains readable after fine ripples fade.
        vec3 windTint = mix(vec3(0.88, 0.94, 1.02), vec3(1.04, 1.14, 1.06), wind);
        water *= mix(vec3(1.0), windTint, windStrength);
        float lightBands = 0.65 + 0.23 * band(0.55, diffuse) + 0.17 * band(0.88, diffuse);
        vec3 color = water * lightBands;

        // Red light is absorbed fastest. Blend transmission here, before
        // reflection and foam, so neither effect is distorted with the seabed.
        vec3 transmission = hasBackground
            ? exp(-vec3(0.22, 0.09, 0.055) * opticalPath * max(u_waterAbsorption, 0.0))
            : vec3(0.0);
        vec3 refractedColor = texture(u_sceneColor, refractionUV).rgb;
        color = color * (1.0 - transmission) + refractedColor * transmission;

        // A restrained crest tint and sky reflection keep the large
        // swells readable without turning the whole surface into white foam.
        color = mix(color, vec3(0.12, 0.66, 0.70),
                    0.16 * band(0.22, surface.Compression));
        float fresnel = pow(1.0 - facing, 4.0);
        float reflection = 0.06 + 0.18 * band(0.12, fresnel) + 0.24 * band(0.48, fresnel);
        reflection *= mix(1.0, mix(1.12, 0.82, wind), windStrength);
        vec3 reflected = reflect(-view, normal);
        // Match the maritime gradient in post_process/gradient_sky.asset.yaml.
        float skyElevation = max(reflected.y, 0.0);
        vec3 sky = mix(vec3(0.78, 0.85, 0.89), vec3(0.38, 0.61, 0.81),
                       1.0 - exp(-skyElevation * 7.0));
        sky = mix(sky, vec3(0.12, 0.32, 0.62), pow(skyElevation, 0.65));
        color = mix(color, sky, reflection);
        vec3 halfVector = normalize(view + light);
        float gloss = mix(96.0, mix(160.0, 48.0, wind), windStrength);
        float glint = pow(max(dot(normal, halfVector), 0.0), gloss);
        color += vec3(0.65, 0.78, 0.75) * band(0.48, glint) * rippleFade * 0.65;

        // Advect and warp the foam pattern; it stays attached to the moving
        // surface instead of swimming across the screen with the camera.
        vec2 drift = p + vec2(-0.22, -0.08) * time;
        vec2 warp = vec2(noise(drift * 0.65), noise(drift * 0.65 + 17.3)) - 0.5;
        float breakup = noise(drift * 1.4 + warp * 1.8);
        float fine = noise(drift * 4.0 - time * 0.12);
        float cell = bubbles(drift * 2.8 + warp * 1.3);
        float lace = band(0.36 + 0.12 * breakup, cell);
        float foamWidth = max(u_foamWidth, 0.01);
        float shore = thickness / foamWidth;
        float wash = 0.5 + 0.5 * sin(shore * 9.0 - time * 1.8 + breakup * 4.0);
        float shoreEnvelope = 1.0 - smoothstep(0.15, 1.0, shore);
        float shoreFoam = shoreEnvelope * band(0.42, breakup * 0.55 + wash * 0.45);
        float contact = 1.0 - smoothstep(0.015, 0.13 + breakup * 0.12, shore);
        shoreFoam = max(contact, shoreFoam * mix(0.3, 1.0, lace));

        // Whitecaps form where the Gerstner surface compresses; noise breaks
        // each crest into patches and cells open up the trailing froth.
        float whitecapDrive = mix(1.0, mix(0.5, 1.45, wind), windStrength);
        float crest = smoothstep(0.24, 0.43, surface.Compression * whitecapDrive);
        float whitecaps = band(0.52, crest * (0.55 + breakup * 0.45)) * lace;
        float foamDetail = 1.0 - smoothstep(0.35, 1.5, length(fwidth(drift * 2.8)));
        // At a distance, replace unresolved foam cells with broad crest coverage
        // in windy patches. Keep the shoreline foam tied to its original depth.
        float distantWhitecaps = crest * (0.25 + 0.5 * wind);
        whitecaps = whitecaps * foamDetail
                  + distantWhitecaps * (1.0 - foamDetail) * windStrength;
        float foam = clamp(max(shoreFoam, whitecaps) * u_foamAmount, 0.0, 1.0);
        float foamMask = band(0.32, foam);
        vec3 foamColor = mix(vec3(0.54, 0.80, 0.81), vec3(0.94, 0.98, 0.89),
                             band(0.52, fine * 0.35 + diffuse * 0.65));
        color = mix(color, foamColor, foamMask);

        // The saved background is already composited above. Alpha blending it
        // again would reintroduce an undistorted copy of the terrain.
        FragColor = vec4(color, 1.0);
    }
