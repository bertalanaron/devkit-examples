asset_type: shader
asset_data:
  source_location: inplace

  vertex: |
    #version 400 core

    layout (location = 0) in vec3 vertex;
    layout (location = 1) in vec3 normal;
    layout (location = 2) in vec2 uv;
    layout (location = 3) in vec3 tangent;
    layout (location = 4) in vec3 bitangent;

    out VS_OUT {
        vec3 Position;
        vec3 Normal;
        vec2 TexCoords;
        vec3 Tangent;
        vec3 Bitangent;
    } vs_out;

    void main()
    {
        // Keep everything in local space here.
        vs_out.Position  = vertex;
        vs_out.Normal    = normal;
        vs_out.TexCoords = uv;
        vs_out.Tangent   = tangent;
        vs_out.Bitangent = bitangent;

        // Required, even though TES will ultimately generate clip-space position.
        gl_Position = vec4(vertex, 1.0);
    }

  tessellation_control: |
    #version 400 core

    layout(vertices = 3) out;

    uniform float u_tessLevel;

    in VS_OUT {
        vec3 Position;
        vec3 Normal;
        vec2 TexCoords;
        vec3 Tangent;
        vec3 Bitangent;
    } tcs_in[];

    out TCS_OUT {
        vec3 Position;
        vec3 Normal;
        vec2 TexCoords;
        vec3 Tangent;
        vec3 Bitangent;
    } tcs_out[];

    void main()
    {
        tcs_out[gl_InvocationID].Position =
            tcs_in[gl_InvocationID].Position;

        tcs_out[gl_InvocationID].Normal =
            tcs_in[gl_InvocationID].Normal;

        tcs_out[gl_InvocationID].TexCoords =
            tcs_in[gl_InvocationID].TexCoords;

        tcs_out[gl_InvocationID].Tangent =
            tcs_in[gl_InvocationID].Tangent;

        tcs_out[gl_InvocationID].Bitangent =
            tcs_in[gl_InvocationID].Bitangent;

        if (gl_InvocationID == 0)
        {
            float level = max(u_tessLevel, 1.0);

            gl_TessLevelOuter[0] = level;
            gl_TessLevelOuter[1] = level;
            gl_TessLevelOuter[2] = level;

            gl_TessLevelInner[0] = level;
        }
    }

  tessellation_evaluation: |
    #version 400 core

    layout(triangles, equal_spacing, ccw) in;

    struct Camera {
        mat4 VP;
        vec3 position;
        vec3 direction;
        float np;
        float fp;
    }; uniform Camera u_camera;

    uniform mat4 u_M;
    uniform float u_t;

    in TCS_OUT {
        vec3 Position;
        vec3 Normal;
        vec2 TexCoords;
        vec3 Tangent;
        vec3 Bitangent;
    } tes_in[];

    out TES_OUT {
        vec3 Position;
        vec3 Normal;
        vec2 TexCoords;
        vec3 Tangent;
        vec3 Bitangent;
    } tes_out;

    float waterHeight(vec2 p)
    {
        float h = 0.0;

        h += 0.10  * sin(dot(p, vec2( 1.0, 0.2)) * 1.4 + u_t * 1.0);
        h += 0.05  * sin(dot(p, vec2(-0.4, 1.0)) * 2.1 + u_t * 1.4);
        h += 0.025 * sin(dot(p, vec2( 0.7, 0.7)) * 3.7 + u_t * 1.8);

        return h;
    }

    vec3 waterNormal(vec2 p)
    {
        vec2 gradient = vec2(0.0);

        gradient +=
            0.10 * 1.4 * vec2(1.0, 0.2) *
            cos(dot(p, vec2(1.0, 0.2)) * 1.4 + u_t * 1.0);

        gradient +=
            0.05 * 2.1 * vec2(-0.4, 1.0) *
            cos(dot(p, vec2(-0.4, 1.0)) * 2.1 + u_t * 1.4);

        gradient +=
            0.025 * 3.7 * vec2(0.7, 0.7) *
            cos(dot(p, vec2(0.7, 0.7)) * 3.7 + u_t * 1.8);

        return normalize(vec3(
            -gradient.x,
            1.0,
            -gradient.y
        ));
    }

    void main()
    {
        vec3 bary = gl_TessCoord;

        vec3 localPosition =
              tes_in[0].Position * bary.x
            + tes_in[1].Position * bary.y
            + tes_in[2].Position * bary.z;

        vec2 texCoords =
              tes_in[0].TexCoords * bary.x
            + tes_in[1].TexCoords * bary.y
            + tes_in[2].TexCoords * bary.z;

        vec3 tangent =
              tes_in[0].Tangent * bary.x
            + tes_in[1].Tangent * bary.y
            + tes_in[2].Tangent * bary.z;

        vec3 bitangent =
              tes_in[0].Bitangent * bary.x
            + tes_in[1].Bitangent * bary.y
            + tes_in[2].Bitangent * bary.z;

        // Y-up water surface
        localPosition.y += waterHeight(localPosition.xz);

        vec3 localNormal = waterNormal(localPosition.xz);

        vec4 worldPosition = vec4(localPosition, 1.0) * u_M;

        mat3 normalMatrix = transpose(inverse(mat3(u_M)));

        tes_out.Position =
            worldPosition.xyz / worldPosition.w;

        tes_out.Normal =
            normalize(localNormal * normalMatrix);

        tes_out.TexCoords = texCoords;
        tes_out.Tangent   = tangent;
        tes_out.Bitangent = bitangent;

        gl_Position = worldPosition * u_camera.VP;
    }

  fragment: |
    #version 400 core

    struct Camera {
        mat4 VP;
        vec3 position;
        vec3 direction;
        float np;
        float fp;
    }; uniform Camera u_camera;

    uniform sampler2D u_sceneDepth;

    in TES_OUT {
        vec3 Position;
        vec3 Normal;
        vec2 TexCoords;
        vec3 Tangent;
        vec3 Bitangent;
    } fs_in;

    out vec4 FragColor;

    float linearizeDepth(float d)
    {
        float zNear = u_camera.np;
        float zFar  = u_camera.fp;
        float z_n = 2.0 * d - 1.0;
        return 2.0 * zNear * zFar / (zFar + zNear - z_n * (zFar - zNear));
    }

    void main()
    {
        vec3 N = normalize(fs_in.Normal);
        vec3 V = normalize(u_camera.position - fs_in.Position);

        if (dot(N, V) < 0.0)
            N = -N;

        vec3 deepColor    = vec3(0.005, 0.055, 0.10);
        vec3 shallowColor = vec3(0.00,  0.28,  0.34);

        float facing = max(dot(N, V), 0.0);

        vec3 waterColor = mix(
            deepColor,
            shallowColor,
            0.25 + 0.45 * facing
        );

        float fresnel =
            0.02 + 0.98 * pow(1.0 - facing, 5.0);

        vec3 reflectedDirection =
            reflect(-V, N);

        vec3 skyHorizon =
            vec3(0.45, 0.65, 0.80);

        vec3 skyTop =
            vec3(0.10, 0.30, 0.55);

        float skyFactor = clamp(
            reflectedDirection.y * 0.5 + 0.5,
            0.0,
            1.0
        );

        vec3 reflectionColor =
            mix(skyHorizon, skyTop, skyFactor);

        vec3 color = mix(
            waterColor,
            reflectionColor,
            fresnel * 0.75
        );

        vec2 screenUV = gl_FragCoord.xy /
        vec2(textureSize(u_sceneDepth, 0));
        float sceneDepth = texture(u_sceneDepth, screenUV).r;

        float surfaceLinearDepth = linearizeDepth(gl_FragCoord.z);
        float sceneLinearDepth = linearizeDepth(sceneDepth);
        float depthDifference = sceneLinearDepth - surfaceLinearDepth;

        // Opaque geometry is closest to the water surface at the shoreline.
        float foam = 1.0 - smoothstep(0.0, 0.6, depthDifference);
        foam *= step(surfaceLinearDepth, sceneLinearDepth);
        color = mix(color, vec3(0.92, 0.98, 0.94), foam * 0.6);

        float opacity = smoothstep(-0.8, 1.0, depthDifference / 6.0);

        vec3 L =
            normalize(vec3(-0.35, 0.8, 0.25));

        vec3 H =
            normalize(V + L);

        float specular =
            pow(max(dot(N, H), 0.0), 180.0);

        color +=
            vec3(1.0, 0.95, 0.80)
            * specular
            * 1.5;

        FragColor = vec4(color, max(opacity, foam));
    }
