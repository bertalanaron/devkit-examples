asset_type: shader
asset_data:
  source_location: inplace
  compute: |
    #version 430 core
    layout(local_size_x = 8, local_size_y = 8) in;

    layout(std430, binding = 0) writeonly buffer Instances { vec4 roots[]; };
    layout(std430, binding = 1) buffer Commands {
        uint count;
        uint instanceCount;
        uint first;
        uint baseInstance;
    };

    uniform sampler2D u_heightMap;
    uniform mat4 u_M;
    uniform float u_terrainHeight;
    uniform float u_grassHeight;
    uniform float u_stoneNormalThreshold;
    uniform float u_materialNoiseAmount;
    uniform float u_materialNoiseScale;
    uniform float u_grassDensity;

    float hash(vec3 p)
    {
        p = fract(p * 0.1031);
        p += dot(p, p.yzx + 33.33);
        return fract((p.x + p.y) * p.z);
    }

    float noise(vec3 p)
    {
        vec3 cell = floor(p);
        vec3 f = fract(p);
        vec3 blend = f * f * (3.0 - 2.0 * f);
        return mix(
            mix(mix(hash(cell), hash(cell + vec3(1, 0, 0)), blend.x),
                mix(hash(cell + vec3(0, 1, 0)), hash(cell + vec3(1, 1, 0)), blend.x), blend.y),
            mix(mix(hash(cell + vec3(0, 0, 1)), hash(cell + vec3(1, 0, 1)), blend.x),
                mix(hash(cell + vec3(0, 1, 1)), hash(cell + vec3(1, 1, 1)), blend.x), blend.y),
            blend.z);
    }

    // Keep this classification in sync with terrain.asset.yaml. Material
    // membership uses world-space noise, independent of fragment derivatives.
    float materialNoise(vec3 p)
    {
        float result = 0.0;
        float weight = 0.5;
        for (int octave = 0; octave < 4; ++octave) {
            result += weight * noise(p);
            p = p * 2.0 + vec3(17.3, 9.2, 5.7);
            weight *= 0.5;
        }
        return result / 0.9375;
    }

    vec2 materialMasks(vec3 position, vec3 normal)
    {
        float boundaryNoise = 2.0 * materialNoise(
            vec3(position.x, 0.0, position.z) * max(u_materialNoiseScale, 0.001)) - 1.0;
        float noisyHeight = position.y + boundaryNoise * max(u_materialNoiseAmount, 0.0);
        float grassMask = smoothstep(u_grassHeight - 0.25, u_grassHeight + 0.25, noisyHeight);
        float threshold = clamp(u_stoneNormalThreshold, 0.0, 1.0);
        float stoneMask = 1.0 - smoothstep(threshold - 0.025, threshold + 0.025, normal.y);
        return vec2(grassMask, stoneMask);
    }

    float elevation(vec2 uv)
    {
        vec2 halfTexel = 0.5 / vec2(textureSize(u_heightMap, 0));
        return textureLod(u_heightMap, clamp(uv, halfTexel, 1.0 - halfTexel), 0.0).r
             * u_terrainHeight;
    }

    void main()
    {
        if (gl_GlobalInvocationID.z != 0u) return;
        uvec2 cell = gl_GlobalInvocationID.xy;
        uvec2 grid = gl_NumWorkGroups.xy * gl_WorkGroupSize.xy;
        // Every candidate can emit at most one root. Limit candidates as well as
        // writes so the atomic count can never exceed the output capacity.
        uint candidate = cell.y * grid.x + cell.x;
        if (candidate >= uint(roots.length())) return;
        float seed = hash(vec3(cell, 19.7));
        if (seed >= clamp(u_grassDensity, 0.0, 1.0)) return;
        vec2 jitter = vec2(hash(vec3(cell, 3.1)), hash(vec3(cell, 8.9)));
        vec2 uv = (vec2(cell) + mix(vec2(0.1), vec2(0.9), jitter)) / vec2(grid);
        float height = elevation(uv);
        vec3 world = (vec4(uv.x - 0.5, height, uv.y - 0.5, 1.0) * u_M).xyz;
        if (world.y <= 0.0) return;

        // Same central differences and model-transformed tangents as terrain TES.
        vec2 texel = 1.0 / vec2(textureSize(u_heightMap, 0));
        float dx = elevation(uv + vec2(texel.x, 0)) - elevation(uv - vec2(texel.x, 0));
        float dz = elevation(uv + vec2(0, texel.y)) - elevation(uv - vec2(0, texel.y));
        vec3 tangentX = (vec4(2.0 * texel.x, dx, 0, 0) * u_M).xyz;
        vec3 tangentZ = (vec4(0, dz, 2.0 * texel.y, 0) * u_M).xyz;
        vec3 normal = normalize(cross(tangentZ, tangentX));
        vec2 masks = materialMasks(world, normal);
        float grassWeight = masks.x * (1.0 - masks.y);
        // Only the grass-dominant part of the blended material grows billboards.
        if (grassWeight <= 0.5) return;

        uint index = atomicAdd(instanceCount, 1u);
        roots[index] = vec4(world, mix(0.7, 1.3, hash(vec3(cell, 31.2))));
    }
