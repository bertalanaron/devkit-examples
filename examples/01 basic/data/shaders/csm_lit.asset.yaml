asset_type: shader
asset_data:
  source_location: inplace
  vertex: |
    #version 400 core

    layout(location = 0) in vec3 vertex;
    layout(location = 1) in vec3 normal;

    struct Camera {
        mat4 VP;
        vec3 position;
        vec3 direction;
        float np;
        float fp;
    }; uniform Camera u_camera;

    uniform mat4 u_M;

    out vec3 WorldPosition;
    out vec3 WorldNormal;

    void main()
    {
        vec4 world = vec4(vertex, 1.0) * u_M;
        WorldPosition = world.xyz / world.w;
        WorldNormal = normalize(normal * transpose(inverse(mat3(u_M))));
        gl_Position = world * u_camera.VP;
    }
  fragment: |
    #version 400 core

    struct Camera {
        mat4 VP;
        vec3 position;
        vec3 direction;
        float np;
        float fp;
    }; uniform Camera u_camera;

    struct Sun {
        mat4 lightspaceM[4];
        float splitDepths[4];
        int cascadeCount;
        vec3 direction;
    }; uniform Sun u_sun;

    uniform sampler2DArrayShadow u_shadowMap;
    uniform bool u_showCascades;
    uniform bool u_shadows;

    in vec3 WorldPosition;
    in vec3 WorldNormal;
    out vec4 FragColor;

    float visibility(int cascade)
    {
        vec4 lightPosition = vec4(WorldPosition, 1.0) * u_sun.lightspaceM[cascade];
        vec3 uv = lightPosition.xyz / lightPosition.w * 0.5 + 0.5;
        if (any(lessThan(uv, vec3(0.0))) || any(greaterThan(uv, vec3(1.0))))
            return 1.0;

        vec2 texel = 1.0 / vec2(textureSize(u_shadowMap, 0).xy);
        // Account for receiver depth variation across the 3x3 filter footprint.
        // Transforming the normal includes each cascade's projection scale.
        vec3 lightNormal = normalize(WorldNormal * transpose(inverse(mat3(u_sun.lightspaceM[cascade]))));
        vec2 depthSlope = abs(lightNormal.xy) / max(abs(lightNormal.z), 0.05);
        float bias = 0.0003 + 1.5 * dot(depthSlope, texel);
        float lit = 0.0;
        for (int y = -1; y <= 1; ++y) {
            for (int x = -1; x <= 1; ++x) {
                vec2 tap = uv.xy + vec2(x, y) * texel;
                // Treat taps outside the light frustum as lit instead of wrapping.
                if (any(lessThan(tap, vec2(0.0))) || any(greaterThanEqual(tap, vec2(1.0))))
                    lit += 1.0;
                else
                    lit += texture(u_shadowMap, vec4(tap, float(cascade), uv.z - bias));
            }
        }
        return lit / 9.0;
    }

    void main()
    {
        // Cascades partition view-space depth, not radial camera distance.
        float viewDepth = dot(WorldPosition - u_camera.position, normalize(u_camera.direction));
        int count = clamp(u_sun.cascadeCount, 1, 4);
        int cascade = count - 1;
        for (int i = 0; i < count; ++i) {
            if (viewDepth <= u_sun.splitDepths[i]) {
                cascade = i;
                break;
            }
        }

        float diffuse = max(dot(normalize(WorldNormal), -normalize(u_sun.direction)), 0.0);
        float shadow = 1.0;
        if (u_shadows && viewDepth >= 0.0 && viewDepth <= u_sun.splitDepths[count - 1])
            shadow = visibility(cascade);

        const vec3 cascadeColors[4] = vec3[4](
            vec3(0.20, 0.55, 0.85), vec3(0.30, 0.75, 0.45),
            vec3(0.85, 0.55, 0.20), vec3(0.70, 0.35, 0.80));
        vec3 baseColor = u_showCascades ? cascadeColors[cascade] : vec3(0.72, 0.74, 0.70);
        FragColor = vec4(baseColor * (0.18 + diffuse * mix(0.25, 1.0, shadow)), 1.0);
    }
